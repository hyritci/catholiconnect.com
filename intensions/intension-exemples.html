<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CatholiConnect - Exemples d'intension</title>

  <link rel="manifest" href="../Manifest.json" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="apple-touch-icon" type="png" href="../assets/CatholiConnect.png" />

  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/intension-exemples.css" />
</head>
<body class="exemples-body">

  <main class="app-container exemples-container">

    <!-- En-tête avec bouton retour + titre -->
    <header class="page-header">
      <button class="btn-back" id="btnBack" type="button" aria-label="Retour">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <h1 class="page-title">INTENSION</h1>
    </header>

    <!-- Bandeau titre de la section -->
    <div class="section-banner">EXEMPLE D'INTENSION</div>

    <!-- Liste des exemples -->
    <div class="exemples-list" id="exemplesList">
      <!-- généré dynamiquement en JS -->
    </div>

  </main>

  <script src="../js/intension-exemples.js"></script>
</body>
</html>
