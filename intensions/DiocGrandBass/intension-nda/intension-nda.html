<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CatholiConnect - Intension</title>

  <link rel="manifest" href="../../../Manifest.json" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="apple-touch-icon" type="png" href="../../../assets/CatholiConnect.png" />

  <link rel="stylesheet" href="../../../css/style.css" />
  <link rel="stylesheet" href="../../../css/intension-nda.css" />
</head>
<body class="details-body">

  <main class="app-container details-container">

    <!-- En-tête avec bouton retour + titre -->
    <header class="page-header">
      <button class="btn-back" id="btnBack" type="button" aria-label="Retour">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <h1 class="page-title">INTENTION</h1>
    </header>

    <!-- Carte de la paroisse sélectionnée + bouton photo -->
    <div class="card-parish-selected">
      <div class="parish-info">
        <div class="parish-name" id="parishName">Notre Dame de l'Assomption</div>
        <div class="parish-location" id="parishLocation">Koumassi-Prodomo</div>
      </div>

    </div>

    <!-- Zone de texte pour la demande -->
    <div class="field-wrapper">
      <textarea
        class="textarea-demande"
        id="demandeText"
        placeholder="Ecrire sa demande"
        rows="6"
      ></textarea>
      <span class="field-error" id="errorDemande">case a renseigner</span>
    </div>

    <button class="link-exemples" id="btnExemples" type="button">VOIR EXEMPLES</button>

    <!-- Champs Jour / Heure -->
    <div class="row-jour-heure">
      <div class="field-wrapper">
        <select class="input-grey select-grey" id="inputJour">
          <option value="" disabled selected>Jour....</option>
          <option value="Lundi">Lundi</option>
          <option value="Mardi">Mardi</option>
          <option value="Mercredi">Mercredi</option>
          <option value="Jeudi">Jeudi</option>
          <option value="Vendredi">Vendredi</option>
          <option value="Samedi">Samedi</option>
          <option value="Dimanche">Dimanche</option>
        </select>
        <span class="field-error" id="errorJour">case a renseigner</span>
      </div>
      <div class="field-wrapper">
        <select class="input-grey select-grey" id="inputHeure" disabled>
          <option value="" disabled selected>Heure...</option>
        </select>
        <span class="field-error" id="errorHeure">case a renseigner</span>
      </div>
    </div>

    <!-- Numéro à débiter -->
    <div class="field-wrapper">
      <input
        type="tel"
        inputmode="numeric"
        pattern="[0-9]*"
        class="input-grey input-numero"
        id="inputNumero"
        placeholder="numero a debiter"
        maxlength="14"
      />
      <span class="field-error" id="errorNumero">case a renseigner</span>
    </div>
    
    <button class="btn-clear" id="btnClear" type="button">
      Tout effacer
    </button>

    <button class="btn-main btn-suivant" id="btnSuivant" type="button">
      SUIVANT &gt;&gt;
    </button>

  </main>

  <!-- Popup limite de mots -->
  <div class="modal-overlay" id="wordLimitModal" hidden>
    <div class="modal-box">
      <p class="modal-text">Seule une intention sera prise en compte</p>
      <button class="modal-btn-ok" id="btnModalOk" type="button">OK</button>
    </div>
  </div>

  <script src="../../../js/intension-nda.js"></script>
</body>
</html>
