<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CatholiConnect - Paiement Wave</title>
 
  <link rel="manifest" href="../../../Manifest.json" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="apple-touch-icon" href="../../../assets/CatholiConnect.png" />
 
  <link rel="stylesheet" href="../../../css/style.css" />
  <link rel="stylesheet" href="../../../css/intension-payement-nda.css" />
</head>
<body class="payment-body">
 
  <main class="app-container payment-container">
 
    <!-- Bandeau titre -->
    <div class="payment-banner">PAIEMENT</div>
 
    <!-- Choix du moyen de paiement (Orange reste indisponible) -->
    <div class="payment-methods">
      <div class="method-wave">WAVE</div>
      <div class="method-column">
        <div class="method-orange">ORANGE</div>
        <span class="unavailable-label">INDISPONIBLE</span>
      </div>
    </div>
 
    <!-- Note d'instruction -->
    <div class="instruction-box">CLICK SUR L'IMAGE POUR PAYER</div>
 
    <!-- QR code Wave (image cliquable, fixe, définie dans le code source) -->
    <button class="qr-button" id="btnQrPay" type="button" aria-label="Payer avec Wave">
      <img id="waveQrImage" src="../../../assets/hyrit-wave.jpeg" alt="QR code de paiement Wave" />
    </button>
 
    <!-- Bouton alternatif après scan manuel -->
    <button class="btn-main btn-scan-done" id="btnScanDone" type="button">
      OU SCAN ET CLICK ICI
    </button>
 
  </main>
 
  <!-- Firebase (SDK "compat", simple à utiliser sans build tool) -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="../../../js/firebase-config.js"></script>
  <script src="../../../js/intension-payement-nda.js"></script>
</body>
</html>
