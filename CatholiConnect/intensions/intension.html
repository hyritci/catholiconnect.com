<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CatholiConnect - Intension</title>

  <link rel="manifest" href="../Manifest.json" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="apple-touch-icon" type="png" href="../assets/CatholiConnect.png" />

  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/intension.css" />
</head>
<body class="intension-body">

  <main class="app-container intension-container">

    <!-- En-tête avec bouton retour + titre -->
    <header class="page-header">
      <button class="btn-back" id="btnBack" type="button" aria-label="Retour">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <h1 class="page-title">INTENSION</h1>
    </header>

    <!-- Sélection du diocèse -->
    <section class="section-block">
      <h2 class="section-title">Choisir Diocese</h2>

      <div class="diocese-list" id="dioceseList">
        <!-- généré dynamiquement en JS -->
      </div>
    </section>

    <!-- Sélection de la paroisse -->
    <section class="section-block">
      <h2 class="section-title section-title--small">Choisir Paroisse</h2>

      <div class="parish-list" id="parishList">
        <!-- généré dynamiquement en JS -->
      </div>
    </section>

  </main>
  
    <!-- Popup d'alerte : délai avant la messe -->
  <div class="modal-overlay" id="delayNoticeModal" hidden>
    <div class="modal-box">
      <p class="modal-text">Merci de faire votre demande au moins 12h avant le jour J</p>
      <button class="modal-btn-ok" id="btnDelayNoticeOk" type="button">COMPRIS</button>
    </div>
  </div>

  <script src="../js/intension.js"></script>
</body>
</html>
