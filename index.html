<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CatholiConnect</title>

  <!-- PWA -->
  <link rel="manifest" href="Manifest.json" />
  <meta name="theme-color" content="#7fc9bb" />

  <link rel="apple-touch-icon" type="png" href="assets/CatholiConnect.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/home.css" />
</head>
<body class="home-body">

  <main class="splash-screen">

    <div class="logo-wrapper">
      <img src="assets/CatholiConnectHome.png" alt="CatholiConnect - mains jointes en prière avec chapelet" class="logo-img" />
    </div>

    <div class="action-buttons">
      <button class="btn-main" id="btnIntension" type="button">
        INTENTION
      </button>

      <button class="btn-main" id="btnDonation" type="button">
        DONATION
      </button>
    </div>
    
      <p class="footer-credit">
  Créer par <a href="https://www.linkedin.com/company/h-y-r-i-t/?viewAsMember=true" target="_blank" rel="noopener">HYRIT</a>
  </p>

  </main>
  

   <!-- Popup MODE TEST -->
  <div class="modal-overlay" id="testModeModal" hidden>
    <div class="modal-box">
      <h2 class="modal-title">Mode test pour l'instant</h2>
      <ul class="modal-list">
        <li>Seule la première paroisse fonctionne (Notre Dame de l'Assomption)</li>
        <li>Les autres paroisses sont figuratives pour le moment</li>
        <li>Le paiement n'est pas encore fonctionnel</li>
      </ul>
      <button class="modal-btn-ok" id="btnCloseTestMode" type="button">J'ai compris</button>
    </div>
  </div>
  
  

  <script src="js/home.js"></script>
</body>
</html>
